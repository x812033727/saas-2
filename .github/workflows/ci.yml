name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "platform[dev]"
      - name: Frontend syntax
        run: node --check platform/ticloud/web/app.js
      - name: Unit + integration tests
        run: cd platform && python -m pytest -q
      - name: Demo HTTP smoke test
        env:
          TICLOUD_DATABASE_URL: sqlite:///./ci-demo.db
          TICLOUD_SMOKE_BASE_URL: http://127.0.0.1:8000
        run: |
          nohup python -m ticloud.api.main --host 127.0.0.1 --port 8000 > /tmp/ticloud-api.log 2>&1 &
          api_pid=$!
          trap "kill $api_pid 2>/dev/null || true" EXIT
          for _ in {1..20}; do
            if curl -sf "$TICLOUD_SMOKE_BASE_URL/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "$TICLOUD_SMOKE_BASE_URL/health" >/dev/null
          python -m ticloud.smoke --base-url "$TICLOUD_SMOKE_BASE_URL"
